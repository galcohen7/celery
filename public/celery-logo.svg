<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Celery logo">
  <!-- leafy top (hair) -->
  <g>
    <ellipse cx="98" cy="60" rx="15" ry="20" transform="rotate(-24 98 60)" fill="#4E7C3A"/>
    <ellipse cx="142" cy="60" rx="15" ry="20" transform="rotate(24 142 60)" fill="#4E7C3A"/>
    <ellipse cx="120" cy="48" rx="17" ry="24" fill="#5E9143"/>
    <ellipse cx="106" cy="50" rx="12" ry="17" transform="rotate(-14 106 50)" fill="#79AE52"/>
    <ellipse cx="134" cy="50" rx="12" ry="17" transform="rotate(14 134 50)" fill="#79AE52"/>
    <ellipse cx="120" cy="42" rx="11" ry="16" fill="#8CBE62"/>
  </g>

  <!-- stalk body -->
  <path d="M84 96 Q84 76 104 76 L136 76 Q156 76 156 96 L156 190 Q156 210 136 210 L104 210 Q84 210 84 190 Z" fill="#CBDFA0"/>
  <!-- celery ribs (subtle) -->
  <g stroke="#AECB82" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="103" y1="90" x2="103" y2="150"/>
    <line x1="120" y1="88" x2="120" y2="150"/>
    <line x1="137" y1="90" x2="137" y2="150"/>
  </g>

  <!-- suit jacket -->
  <path d="M84 168 L120 186 L156 168 L156 190 Q156 210 136 210 L104 210 Q84 210 84 190 Z" fill="#354A32"/>
  <!-- shirt -->
  <path d="M107 168 L120 188 L133 168 Z" fill="#FFFFFF"/>
  <!-- collar -->
  <path d="M107 168 L120 188 L113 172 Z" fill="#EAEFE3"/>
  <path d="M133 168 L120 188 L127 172 Z" fill="#EAEFE3"/>
  <!-- tie -->
  <path d="M116 170 L124 170 L120 179 Z" fill="#5C7F3D"/>
  <path d="M120 179 L126 184 L122 205 L118 205 L114 184 Z" fill="#7FA65C"/>

  <!-- sunglasses -->
  <g fill="#232B22">
    <rect x="96" y="100" width="22" height="17" rx="7"/>
    <rect x="122" y="100" width="22" height="17" rx="7"/>
    <rect x="116" y="105" width="8" height="4" rx="2"/>
  </g>
  <!-- lens shine -->
  <g fill="#FFFFFF" opacity="0.28">
    <rect x="100" y="103" width="8" height="4" rx="2"/>
    <rect x="126" y="103" width="8" height="4" rx="2"/>
  </g>

  <!-- smile -->
  <path d="M101 131 Q120 160 139 131 Z" fill="#2A2320"/>
  <path d="M104 130 Q120 145 136 130 Z" fill="#FFFFFF"/>

  <!-- sparkle -->
  <path d="M149 120 L151.5 126 L158 128.5 L151.5 131 L149 137 L146.5 131 L140 128.5 L146.5 126 Z" fill="#FFFFFF"/>
  <circle cx="139" cy="139" r="2.2" fill="#FFFFFF"/>
</svg>
