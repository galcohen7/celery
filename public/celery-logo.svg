<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Celery">
  <!-- לוגו Celery — גרסה מפושטת.
       עקרונות: צללית אחת ברורה, שלושה עלים במקום שישה, משקפיים בולטים
       כצורה אחת מחוברת, וחיוך שנותן אופי. ללא ניצוץ, ללא עניבה, ללא כיס. -->

  <!-- עלים: שלושה בלבד, סימטריים, בשתי רמות עומק -->
  <path d="M120 26c14 0 24 12 24 26s-10 24-24 24-24-10-24-24 10-26 24-26z" fill="#8CBE62"/>
  <path d="M92 44c11-5 22 2 26 14s-2 23-13 26-21-6-24-18 0-17 11-22z" fill="#5E9143"/>
  <path d="M148 44c-11-5-22 2-26 14s2 23 13 26 21-6 24-18 0-17-11-22z" fill="#5E9143"/>

  <!-- גבעול: צורה אחת, פינות מעוגלות, מתרחבת קלות למטה -->
  <path d="M120 78c22 0 34 10 34 28v76c0 20-13 32-34 32s-34-12-34-32v-76c0-18 12-28 34-28z" fill="#CBDFA0"/>

  <!-- שני קווי גבעול בלבד, מרמזים על מרקם -->
  <g stroke="#AECB82" stroke-width="4" stroke-linecap="round" opacity=".85">
    <line x1="105" y1="96" x2="105" y2="150"/>
    <line x1="135" y1="96" x2="135" y2="150"/>
  </g>

  <!-- משקפי שמש: צורה אחת מחוברת, נוכחות חזקה -->
  <path d="M88 108h64a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-2v6c0 9-7 16-16 16s-16-7-16-16v-4h-4v4c0 9-7 16-16 16s-16-7-16-16v-6h-2a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4z" fill="#232B22"/>
  <path d="M96 116h18v10c0 5-4 9-9 9s-9-4-9-9z" fill="#3A4A38" opacity=".55"/>
  <path d="M126 116h18v10c0 5-4 9-9 9s-9-4-9-9z" fill="#3A4A38" opacity=".55"/>

  <!-- חיוך: קו אחד, בטוח -->
  <path d="M104 158c5 8 27 8 32 0" stroke="#3E5C32" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
