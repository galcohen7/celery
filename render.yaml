# הגדרת הפריסה ל-Render. Render קורא את הקובץ הזה ומקים את שירות הווב.
#
# מסד הנתונים **לא** מוקם כאן: Postgres החינמי של Render פג אחרי 30 יום
# ונמחק עם כל הנתונים. המסד יושב ב-Neon (שכבה חינמית שלא פגה), ואת
# מחרוזת החיבור שלו מזינים ידנית בלוח הבקרה — ראה DEPLOY.md.
services:
  - type: web
    name: celery-app
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false              # מחרוזת החיבור של Neon, מוזנת ידנית ולא נשמרת ב-git
      - key: JWT_SECRET
        generateValue: true      # Render ייצר מחרוזת אקראית מאובטחת
      - key: ANTHROPIC_API_KEY
        sync: false              # מוזן ידנית בלוח הבקרה של Render, לא נשמר ב-git
      - key: NODE_ENV
        value: production
      # מייל איפוס סיסמה — ראה DEPLOY.md
      - key: BREVO_API_KEY
        sync: false              # מפתח API של Brevo, מוזן ידנית
      - key: MAIL_FROM
        sync: false              # כתובת השולח שאומתה ב-Brevo
      - key: APP_URL
        value: https://celery-app-g0w2.onrender.com   # לקישור במייל
