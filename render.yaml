# הגדרת הפריסה ל-Render. Render קורא את הקובץ הזה ומקים אוטומטית
# שירות ווב + מסד נתונים PostgreSQL מנוהל.
services:
  - type: web
    name: celery-app
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: celery-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # Render ייצר מחרוזת אקראית מאובטחת
      - key: ANTHROPIC_API_KEY
        sync: false              # מוזן ידנית בלוח הבקרה של Render, לא נשמר ב-git
      - key: NODE_ENV
        value: production

databases:
  - name: celery-db
    plan: free
    databaseName: celery
